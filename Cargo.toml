[package]
name = "ghostty-vt-sys"
version = "0.1.0"
edition = "2024"
description = "Raw Rust bindings and native build integration for libghostty-vt"
repository = "https://github.com/dan-fel/ghostty-vt-sys"
publish = false
links = "ghostty-vt"

[build-dependencies]
bindgen = { version = "0.73.2", default-features = false, features = ["runtime"] }

[dev-dependencies]
serde_json = "1"
